services:
  app:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8001:8000"
    volumes:
      - ./:/app
      - my_media:/files/media
      - my_static:/files/static
    command: >
      sh -c "python manage.py wait_for_db &&
            python manage.py migrate &&
            gunicorn airport_service.wsgi:application --bind 0.0.0.0:8000 --timeout 120"
    depends_on:
      - db


  db:
    image: postgres:16.0-alpine3.17
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - my_db:$PGDATA

volumes:
  my_db:
  my_media:
  my_static: